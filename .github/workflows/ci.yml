name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  SOLUTION_PATH: Microservices.Ecommerce.sln
  DOTNET_VERSION: 10.0.x

jobs:
  build:
    name: Restore and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Run unit tests
        run: |
          dotnet test tests/Catalog.UnitTests/Catalog.UnitTests.csproj --configuration Release --verbosity normal
          dotnet test tests/Basket.UnitTests/Basket.UnitTests.csproj --configuration Release --verbosity normal
          dotnet test tests/Ordering.UnitTests/Ordering.UnitTests.csproj --configuration Release --verbosity normal
